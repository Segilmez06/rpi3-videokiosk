# mpv configuration for Raspberry Pi 3 Headless DRM Video Kiosk

# Display & Video Output (Direct Rendering Manager / KMS)
vo=gpu
gpu-context=drm
hwdec=auto-safe

# Zero UI / Silent Kiosk Presentation
no-audio
no-osd-bar
osd-level=0
cursor-autohide=always
no-input-default-bindings
term-playing-msg=""
msg-level=all=no

# Looping & Playback Continuity
loop-playlist=inf
reset-on-next-file=pause
keep-open=yes
image-display-duration=inf
