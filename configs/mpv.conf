# mpv configuration for Raspberry Pi 3 Headless DRM Video Kiosk

# Display & Video Output (Direct Rendering Manager / KMS)
vo=gpu
gpu-context=drm

# Hardware decoding: explicitly prefer V4L2 M2M (Pi 3's bcm2835-codec),
# fall back to auto-safe for any other supported codec.
hwdec=v4l2m2m-copy,auto-safe

# Prefetch next file while the current one is still playing (gapless transition)
prefetch-playlist=yes

# Sync video to display refresh rate — smoother on 50/60Hz panels
video-sync=display-resample

# Drop frames at the output stage only, never discard demuxed packets
framedrop=vo

# Reset pause state between files so playlist always continues
reset-on-next-file=pause

# Read-ahead buffer: 64MB forward, 16MB back, 10s lookahead
cache=yes
demuxer-max-bytes=64M
demuxer-max-back-bytes=16M
demuxer-readahead-secs=10

# Zero UI / Silent Kiosk Presentation
no-audio
no-osd-bar
osd-level=0
cursor-autohide=always
no-input-default-bindings
term-playing-msg=""
msg-level=all=no

# Looping & Playback Continuity
loop-playlist=inf
keep-open=yes
image-display-duration=inf
