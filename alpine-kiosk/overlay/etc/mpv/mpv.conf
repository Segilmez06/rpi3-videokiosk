# MPV Configuration for Raspberry Pi 3 Model B (Alpine Linux 3.24.2)
# Direct DRM/KMS Video Output with Hardware Acceleration

# Video Output
vo=gpu
gpu-context=drm
drm-connector=HDMI-A-1

# Hardware Video Decoding (V4L2 M2M H.264 / VC4)
hwdec=v4l2m2m-copy,auto-safe

# Playback Behavior
loop-playlist=inf
no-audio
really-quiet
terminal=no
cursor-autohide=always
prefetch-playlist=yes

# Timing & Frame Dropping
video-sync=display-resample
interpolation=no
framedrop=vo
vd-lavc-threads=4
