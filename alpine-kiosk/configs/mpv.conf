# MPV Configuration for Raspberry Pi 3 Model B (Alpine Linux 3.24.2)
# Direct DRM/KMS Video Output with Hardware Acceleration

# Video Output (Direct DRM KMS)
vo=gpu
gpu-context=drm

# Hardware Video Decoding (Auto-detect V4L2 M2M H.264 / VC4)
hwdec=auto-safe

# Playback Behavior
loop-playlist=inf
no-audio
cursor-autohide=always
prefetch-playlist=yes

# Smooth Playback
framedrop=vo
vd-lavc-threads=4
