name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Appliance & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl tar gzip xz-utils parted dosfstools mtools \
            clang lld llvm python3 python3-pil

      - name: Build Video Kiosk Images
        run: |
          ./alpine-kiosk/build.sh

      - name: Calculate SHA256 Checksums
        run: |
          cd output
          sha256sum alpine-kiosk.img.xz alpine-kiosk-sdcard.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="v${VERSION}"
          echo "Publishing release for ${TAG}..."

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Uploading new build assets..."
            gh release upload "${TAG}" \
              output/alpine-kiosk.img.xz \
              output/alpine-kiosk-sdcard.tar.gz \
              output/SHA256SUMS \
              --clobber
          else
            echo "Creating new release ${TAG} with auto-generated release notes..."
            gh release create "${TAG}" \
              output/alpine-kiosk.img.xz \
              output/alpine-kiosk-sdcard.tar.gz \
              output/SHA256SUMS \
              --title "Video Kiosk ${TAG}" \
              --generate-notes
          fi
